<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="32x32"  href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon"                      href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KuramaTracker" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- SEO Meta Tags -->
    <meta name="description" content="KuramaTracker - Rastrea tu anime, compite con amigos en el Quiz Diario, sube en el ranking mensual y descubre nuevas series. La app de anime para los fans." />
    <meta name="keywords" content="anime tracker, seguimiento anime, quiz anime, ranking anime, anilist, kuramatracker" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://anime-tracker-wine.vercel.app/" />

    <!-- Open Graph (para compartir en redes sociales) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anime-tracker-wine.vercel.app/" />
    <meta property="og:title" content="KuramaTracker - Rastrea tu anime" />
    <meta property="og:description" content="Rastrea tu anime, compite en el Quiz Diario y sube en el ranking mensual. La app de anime para los fans." />
    <meta property="og:image" content="https://anime-tracker-wine.vercel.app/icon-512.png" />

    <title>KuramaTracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('ServiceWorker registrado con éxito: ', registration.scope);
            })
            .catch((error) => {
              console.log('Error al registrar ServiceWorker: ', error);
            });
        });
      }
    </script>
  </body>
</html>
